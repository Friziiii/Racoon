:root{
  --ink:#050B24; --blue:#2458FF; --blue2:#4C7BFF; --ice:#D6E4FF; --mist:#8FA6D9; --mint:#5CF2B0; --amber:#FFC857; --rose:#FF5C7A;
  --sans:'K5 Display','Inter Display','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'K5 Mono','DejaVu Sans Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;font-family:var(--sans);color:#fff;position:relative;overflow-x:hidden;line-height:1.5;
  background:
    radial-gradient(520px 420px at calc(50% - 227px) -4px, rgba(36,88,255,.55), transparent 62%),
    radial-gradient(560px 460px at calc(50% + 270px) 46%, rgba(36,88,255,.30), transparent 60%),
    radial-gradient(520px 380px at calc(50% - 54px) 108%, rgba(76,123,255,.38), transparent 62%),
    linear-gradient(180deg,#050B24 0%,#08123A 55%,#050B24 100%);
  background-color:var(--ink);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;
  background-image:radial-gradient(rgba(160,190,255,.22) 1px,transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%);
}
h1,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid #7FA2FF;outline-offset:3px}

.app{position:relative;max-width:540px;margin:0 auto;padding:34px 30px 26px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{width:30px;height:39px;filter:drop-shadow(0 2px 10px rgba(36,88,255,.55))}
.brand b{font-size:19px;font-weight:700;letter-spacing:.14em}
.pill{font-size:11px;font-weight:500;color:var(--ice);padding:6px 11px;border-radius:999px;white-space:nowrap;
  background:rgba(255,255,255,.07);border:1px solid rgba(150,180,255,.25);display:flex;align-items:center;gap:7px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}

h1{margin-top:26px;font-size:35px;line-height:1.12;font-weight:650;letter-spacing:-.028em;text-wrap:balance}
h1 span{display:block}
h1 span:nth-child(3){color:var(--mist)}

/* ---------- the seal (also the drop target) ---------- */
.seal{
  position:relative;width:min(326px,calc(100vw - 60px));aspect-ratio:1;margin:6px auto 0;container-type:inline-size;
  --st-rgb:92,242,176; --edge-rgb:160,190,255; --glow-rgb:36,88,255;
  -webkit-tap-highlight-color:transparent;
}
.seal[data-v="caution"]{--st-rgb:255,200,87;--edge-rgb:255,200,87;--glow-rgb:255,170,40}
.seal[data-v="threat"],.seal[data-v="tampered"]{--st-rgb:255,92,122;--edge-rgb:255,92,122;--glow-rgb:255,60,90}
.seal[data-v="idle"],.seal[data-v="busy"]{--st-rgb:120,160,255}
.seal.clickable{cursor:pointer}
.seal .glow{position:absolute;inset:9.2%;border-radius:50%;background:radial-gradient(circle,rgba(var(--glow-rgb),.65),rgba(var(--glow-rgb),0) 68%);filter:blur(14px);transition:background .4s}
.seal svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seal[data-v="busy"] svg.ring{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{
  position:absolute;inset:17.8%;border-radius:50%;
  background:radial-gradient(circle at 50% 28%,rgba(120,160,255,.34),rgba(20,40,120,.55) 62%,rgba(8,18,64,.85));
  border:1px solid rgba(var(--edge-rgb),.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -30px 60px rgba(36,88,255,.25),0 20px 60px rgba(20,60,255,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  transition:border-color .3s,box-shadow .3s;
}
.seal[data-v="idle"] .disc{border:1.5px dashed rgba(120,160,255,.7)}
.seal.clickable[data-v="idle"]:hover .disc,.seal.over .disc{border-color:#9DB6FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -30px 60px rgba(36,88,255,.35),0 20px 70px rgba(36,88,255,.75)}
.tick{
  width:62px;height:62px;width:19cqw;height:19cqw;border-radius:50%;display:grid;place-items:center;color:rgb(var(--st-rgb));
  background:rgba(var(--st-rgb),.14);border:1.5px solid rgba(var(--st-rgb),.7);box-shadow:0 0 26px rgba(var(--st-rgb),.45);
  transition:background .3s,border-color .3s,box-shadow .3s,color .3s;
}
.tick svg{width:30px;height:30px;width:9.2cqw;height:9.2cqw}
.spin{width:44%;height:44%;border-radius:50%;border:2.5px solid rgba(120,160,255,.28);border-top-color:#9DB6FF;animation:spin .9s linear infinite}
.disc strong{margin-top:12px;font-size:27px;font-size:8.28cqw;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.disc strong[data-long="1"]{font-size:23px;font-size:7.1cqw}
.disc small{margin-top:3px;font-size:11.5px;font-size:3.53cqw;color:var(--ice);opacity:.85;line-height:1.3;max-width:150px;max-width:46cqw}
.file{
  position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;white-space:nowrap;max-width:100%;
  padding:8px 14px 8px 10px;border-radius:14px;background:rgba(10,21,64,.86);border:1px solid rgba(150,180,255,.32);
  box-shadow:0 10px 30px rgba(0,0,20,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.file .ic{flex:none;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#2F63FF,#1A3BD6);display:grid;place-items:center}
.file .ic svg{width:14px;height:14px}
.file span{font-size:12.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.file em{font-style:normal;font-size:11.5px;color:var(--mist)}

/* ---------- details card ---------- */
.card{
  margin-top:24px;border-radius:22px;padding:4px 18px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  border:1px solid rgba(150,180,255,.24);box-shadow:0 18px 50px rgba(0,10,60,.45);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:13.5px}
.row+.row{border-top:1px solid rgba(150,180,255,.16)}
.row .ri{flex:none;width:18px;height:18px;display:grid;place-items:center}
.row .ri svg{width:18px;height:18px}
.row .k{flex:1;color:var(--ice);min-width:0}
.row .v{color:#fff;font-weight:550;text-align:right}
.row .v.m{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--mist)}
.row.ok .ri{color:var(--mint)} .row.warn .ri{color:var(--amber)} .row.bad .ri{color:var(--rose)}
.row.idle .ri{color:var(--mist);opacity:.6} .row.hash .ri{color:var(--mist)}
.row.warn .v{color:#FFD98A} .row.bad .v{color:#FF9DB0}
.row.idle .v{color:var(--mist);font-weight:400}
.row.small{padding:8px 0;font-size:12.5px}
.row.small .ri,.row.small .ri svg{width:15px;height:15px}
.row.small .k{color:#fff;opacity:.9}

/* ---------- drop zone for the received file ---------- */
.drop{
  margin-top:14px;border-radius:20px;padding:13px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  border:1.5px dashed rgba(120,160,255,.65);background:rgba(36,88,255,.10);transition:background .2s,border-color .2s,opacity .2s;
}
.drop:hover,.drop.over{background:rgba(36,88,255,.2);border-color:#9DB6FF}
.drop[aria-disabled="true"]{opacity:.55}
.drop .up{flex:none;width:44px;height:44px;border-radius:14px;background:rgba(76,123,255,.22);display:grid;place-items:center;color:#9DB6FF}
.drop .up svg{width:22px;height:22px}
.drop b{display:block;font-size:14.5px;font-weight:600}
.drop small{display:block;margin-top:2px;font-size:11.5px;color:var(--mist)}

/* ---------- action ---------- */
.cta{
  margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:18px;
  font-size:16px;font-weight:650;letter-spacing:-.005em;color:#fff;
  background:linear-gradient(180deg,#3B6CFF,#1F46F0);border:1px solid rgba(190,210,255,.55);
  box-shadow:0 0 0 6px rgba(36,88,255,.18),0 16px 40px rgba(36,88,255,.65),inset 0 1px 0 rgba(255,255,255,.4);
  transition:filter .15s,transform .1s;
}
.cta:hover{filter:brightness(1.1)}
.cta:active{transform:translateY(1px)}
.cta svg{width:18px;height:18px}
.linkline{
  display:block;width:100%;margin-top:14px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--mist);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.linkline:hover{color:#fff}

footer{margin-top:22px;text-align:center;font-size:11px;color:var(--mist)}
.fnav{margin-top:8px;display:flex;justify-content:center;gap:16px}
.fnav button{font-size:11px;color:var(--mist);text-underline-offset:3px}
.fnav button:hover{color:#fff;text-decoration:underline}

/* ---------- toast + modal ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;max-width:calc(100vw - 40px);
  padding:11px 16px;border-radius:14px;font-size:13px;font-weight:500;text-align:center;
  background:rgba(10,21,64,.92);border:1px solid rgba(150,180,255,.35);box-shadow:0 14px 40px rgba(0,0,30,.6);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

      if (l.length > 5000 && (l.split(' ').length - 1) / l.length < 0.03) { add('medium', 'Very long, whitespace-poor line (minified/packed code)', `line ${k + 1}: ${l.length.toLocaleString()} chars`); break; }
    }
    return out;
  }

  /* ---- 7. Links, hidden text and prompt-injection ---- */
  const NOISE_HOST = /(^|\.)(ns\.adobe\.com|w3\.org|purl\.org|openxmlformats\.org|schemas\.microsoft\.com|xmlsoap\.org|iptc\.org|sodipodi\.sourceforge\.net|xmlns\.com|oasis-open\.org|useplus\.org|cipa\.jp|pdfa\.org|aiim\.org|exif\.org)$/i;
  const SHORTENERS = /^(bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|cutt\.ly|rb\.gy|shorturl\.at|ow\.ly|buff\.ly|tiny\.cc|rebrand\.ly|bl\.ink|t\.ly|v\.gd|s\.id|lnkd\.in|shorte\.st|adf\.ly)$/i;
  const EXFIL_HIGH = /(^|\.)(discord(app)?\.com\/api\/webhooks|api\.telegram\.org\/bot|webhook\.site|oast\.(fun|live|pro|site|me|online)|interact\.sh|burpcollaborator\.net|requestbin\.\w+|pipedream\.net)/i;
  const EXFIL_MED = /(^|\.)(pastebin\.com\/raw|transfer\.sh|ngrok(-free)?\.(io|app|dev)|trycloudflare\.com|serveo\.net|localtunnel\.me|paste\.ee|hastebin\.com\/raw)/i;
  const RISKY_FILE = /\.(exe|msi|scr|bat|cmd|ps1|vbs|hta|jar|apk|dmg|pkg|sh|lnk|iso|dll)(?:$|\?)/i;
  const RISKY_TLD = /\.(zip|mov|top|xyz|tk|ml|ga|cf|gq|click|icu|cyou|monster|rest|sbs)$/i;
  const URL_RE = /\b(?:https?|ftp):\/\/[\x21-\x7e]{4,300}/gi;
  const isPrivateIp = h => /^(10\.|127\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.|0\.)/.test(h);

  function checkLinks(text) {
    const E = 'link-check', out = [], domains = new Set(), seen = new Set();
    const add = (sev, title, detail, ev) => {
      const k = title + '|' + ev;
      if (seen.has(k) || out.length >= 12) return;
      seen.add(k); out.push(F(E, sev, title, detail, clip(ev, 120)));
    };
    let n = 0;
    for (const m of text.matchAll(URL_RE)) {
      if (++n > 3000) break;
      const raw = m[0].split(/["'<>\\`{}|^]/)[0].replace(/[).,;\]]+$/, '');
      let u;
      try { u = new URL(raw); } catch { continue; }
      const host = u.hostname.toLowerCase().replace(/\.$/, '');
      if (!host || NOISE_HOST.test(host)) continue;
      domains.add(host);
      const hp = host + u.pathname.toLowerCase();
      if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) {
        if (!isPrivateIp(host)) add('medium', 'Link to a raw IP address', 'Legitimate sites rarely use bare IPs; common for malware servers.', raw);
      } else if (host.endsWith('.onion')) add('medium', 'Link to a Tor (.onion) address', '', raw);
      if (EXFIL_HIGH.test(hp)) add('high', 'Link to a data-exfiltration / callback endpoint', 'Webhook-style URLs are how stealers and backdoors send data out.', raw);
      else if (EXFIL_MED.test(hp)) add('medium', 'Link to a paste / tunnel / file-drop service', 'Often used to host or receive payloads.', raw);
      if (SHORTENERS.test(host)) add('medium', 'Shortened link hides its real destination', '', raw);
      if (host.split('.').some(p => p.startsWith('xn--'))) add('medium', 'Look-alike (punycode) domain', 'Internationalised domains can imitate trusted brands.', raw);
      if (u.username) add('medium', 'Link contains embedded credentials / "@" trick', 'The text before "@" is not the real destination.', raw);
      if (RISKY_FILE.test(u.pathname + u.search)) add('medium', 'Link downloads an executable or script', '', raw);
      if (RISKY_TLD.test(host)) add('low', 'Link on a frequently abused domain extension', '', raw);
    }
    return { findings: out, domains: [...domains].slice(0, 30) };
  }

  const INJ = [
    /ignore\s+(?:all\s+|any\s+|the\s+)?(?:previous|prior|above|earlier)\s+(?:instructions?|prompts?|messages?|rules)/i,
    /disregard\s+(?:all\s+|any\s+|the\s+)?(?:previous|prior|above|earlier|system)\s+(?:instructions?|prompts?|rules)/i,
    /(?:reveal|print|show|repeat|output)\s+(?:your\s+|the\s+)?(?:system|hidden|initial)\s+(?:prompt|instructions?)/i,
    /you\s+are\s+now\s+(?:in\s+)?(?:dan|developer\s+mode|jailbreak|an?\s+unrestricted)/i,
    /do\s+not\s+(?:tell|inform|mention|reveal)[^.\n]{0,40}\b(?:user|human|operator)\b/i,
    /\b(?:new|updated|override)\s+(?:system\s+)?instructions?\s*:/i,
    /<\s*\/?\s*(?:system|assistant|im_start|im_end)\s*>|\[\/?INST\]|<\|im_(?:start|end)\|>/i,
    /(?:send|post|forward|upload|exfiltrate|leak)\s+(?:all\s+|the\s+|any\s+)?(?:conversation|chat\s+history|user\s+data|data|files?|secrets?|credentials?|api\s+keys?)\s+(?:to|via)\s+(?:https?:|\S+@)/i,
    /\b(?:AI|assistant|LLM|language\s+model|chatgpt|claude)\b[^.\n]{0,60}\b(?:must|should)\s+(?:now\s+)?(?:recommend|rank|rate|score|approve|select|hire)\b[^.\n]{0,40}\b(?:this|the following|me|candidate)\b/i
  ];
  const HTML_HIDE = /display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0(?![.\d])|opacity\s*:\s*0(?![.\d])|color\s*:\s*(?:#fff(?:fff)?|white)\b|\bhidden\b\s*[=>]/i;
  const CODE_EXT = new Set(['.js', '.mjs', '.cjs', '.ts', '.jsx', '.tsx', '.py', '.php', '.go', '.c', '.h', '.cpp', '.cc', '.hpp', '.java', '.rb', '.sh', '.bash', '.ps1', '.pl', '.rs', '.cs', '.bat', '.cmd', '.vbs', '.lua', '.sql']);

  function findInjection(s) {
    for (const rx of INJ) { const m = rx.exec(s); if (m) return m[0]; }
    return null;
  }

  function checkHidden(text, o = {}) {
    const out = [], E = 'hidden-content';
    let tag = '';
    if (!o.latin) {
      for (const ch of text) {
        const cp = ch.codePointAt(0);
        if (cp >= 0xE0020 && cp <= 0xE007E) tag += String.fromCharCode(cp - 0xE0000);
      }
    }
    const zw = (text.slice(1).match(/[​⁠-⁤᠎﻿]/g) || []).length;
    const hiddenChars = tag.length > 0 || zw > 8;
    if (tag) out.push(F(E, 'high', 'Invisible Unicode "tag" characters (hidden text that only an AI would read)', `${tag.length} hidden characters`, clip(tag, 120)));
    if (zw > 8) out.push(F(E, 'medium', 'Many zero-width characters (hidden text / tracking)', `${zw} invisible characters`));
    if (/[‪-‮⁦-⁩]/.test(text)) out.push(F(E, CODE_EXT.has(o.ext) ? 'high' : 'medium', 'Bidirectional control characters (text spoofing / "Trojan Source")', 'Can make code or text look different from what actually runs or reads.'));
    const inj = findInjection(tag ? text + '\n' + tag : text);
    if (inj) {
      const hid = hiddenChars || o.mech;
      out.push(F(E, hid ? 'high' : 'medium',
        hid ? 'Hidden instructions aimed at AI assistants (prompt injection)' : 'Text that tries to instruct an AI (possible prompt injection)',
        hid ? 'Instruction-like text combined with a hiding technique.' : 'Could be harmless (e.g. a security article) — check the context.', clip(inj, 120)));
    }
    return out;
  }

  /* Inflate with an output cap so a decompression bomb cannot exhaust memory. */
  async function inflateCapped(data, fmt, cap) {
    try {
      const ds = new DecompressionStream(fmt);
      const w = ds.writable.getWriter();
      w.write(data).catch(() => {});
      w.close().catch(() => {});
      const rd = ds.readable.getReader();
      const parts = []; let n = 0;
      while (n < cap) {
        let r;
        try { r = await rd.read(); } catch { break; }   // keep what decoded before the error
        if (r.done) break;
        parts.push(r.value); n += r.value.length;
      }
      rd.cancel().catch(() => {});
      const o = new Uint8Array(Math.min(n, cap)); let p = 0;
      for (const c of parts) { const t = c.subarray(0, o.length - p); o.set(t, p); p += t.length; if (p >= o.length) break; }
      return o.length ? o : null;
    } catch { return null; }
  }

  /* Decode Flate streams in a PDF so keywords/scripts/text inside compressed objects become visible. */
  async function pdfStreams(bytes, str) {
    let pos = 0, total = 0, n = 0;
    const out = [];
    while (n < 400 && total < 24e6) {
      const s = str.indexOf('stream', pos);
      if (s < 0) break;
      pos = s + 6;
      if (str.slice(s - 3, s) === 'end') continue;
      let st = s + 6;
      if (str[st] === '\r') st++;
      if (str[st] === '\n') st++;
      const e = str.indexOf('endstream', st);
      if (e < 0) break;
      pos = e + 9; n++;
      const head = str.slice(Math.max(0, s - 500), s);
      const oi = head.lastIndexOf('obj');
      const dict = oi >= 0 ? head.slice(oi) : head;
      if (/\/Subtype\s*\/Image|\/FontFile|\/Type\s*\/XRef|\/Type\s*\/Metadata/.test(dict)) continue;
      if (!/\/(?:FlateDecode|Fl)\b/.test(dict) || e - st < 8 || e - st > 8e6) continue;
      const dec = await inflateCapped(bytes.subarray(st, e), 'deflate', 2e6);
      if (dec) { const t = latin1(dec); out.push(t); total += t.length; }
    }
    return out.join('\n');
  }

  /* ---- Orchestration + verdict ---- */
  async function scanBuffer(name, buf) {
    const b = new Uint8Array(buf);
    const ext = (/\.[^./\\]+$/.exec(name) || [''])[0].toLowerCase();
    const s = sniff(b), type = s.type, findings = [];
    findings.push(...checkFileType(name, ext, type));

    const partial = b.length > FULL_SCAN;
    const scanBytes = partial ? (() => { const x = new Uint8Array(FULL_SCAN); x.set(b.subarray(0, FULL_SCAN / 2)); x.set(b.subarray(b.length - FULL_SCAN / 2), FULL_SCAN / 2); return x; })() : b;
    if (partial) findings.push(F('scanner', 'medium', 'File too large for a full in-browser scan', 'Only the first and last 32 MB were pattern-scanned.'));
    const str = latin1(scanBytes);
    let linkText = null;

    if (MEDIA.has(type) || type === 'pdf' || type === 'binary' || EXE.has(type)) findings.push(...checkPolyglot(str, type));
    if (type === 'png' || type === 'jpeg') findings.push(...checkImage(b, type));
    if (type === 'pdf') {
      const extra = await pdfStreams(scanBytes, str);
      const full = extra ? str + '\n' + extra : str;
      findings.push(...checkPdf(full));
      findings.push(...checkHidden(full, { latin: true, mech: /\b3\s+Tr\b/.test(full) }));
      linkText = full;
    }
    if (type === 'ole') findings.push(...checkOle(str));
    if (type === 'rtf') findings.push(...checkRtf(str));
    if (type === 'ooxml') {
      const o = await checkOoxml(b, s.zip);
      findings.push(...o);
      const xml = o.xmlText || '';
      const mech = /<w:vanish\b|<w:color w:val="FFFFFF"|<w:sz w:val="[12]"/i.test(xml);
      findings.push(...checkHidden(xml.replace(/<\/(?:w|a):p>/g, '\n').replace(/<[^>]+>/g, ''), { mech }));
      linkText = xml;
    }
    if (type === 'zip') findings.push(...checkZip(s.zip));
    if (type === 'text') {
      const text = (b[0] === 0xff && b[1] === 0xfe) ? new TextDecoder('utf-16le').decode(b) : new TextDecoder().decode(scanBytes);
      findings.push(...await checkText(text));
      findings.push(...checkHidden(text, { ext, mech: HTML_HIDE.test(text) }));
      linkText = text;
    }
    if (linkText === null && !['zip', 'archive', 'empty', 'ooxml'].includes(type)) linkText = str;
    const lk = linkText ? checkLinks(linkText) : { findings: [], domains: [] };
    findings.push(...lk.findings);
    if (MEDIA.has(type)) {
      const inj = findInjection(str);
      if (inj) findings.push(F('hidden-content', 'high', 'Instructions aimed at AI assistants hidden inside a media file', 'Found in metadata or appended data, where a viewer would not see it.', clip(inj, 120)));
    }
    findings.sort((a, c) => SEVN[c.sev] - SEVN[a.sev]);
    const top = findings.length ? SEVN[findings[0].sev] : 0;
    const code = top >= SEVN.high ? 'threat' : top === SEVN.medium ? 'caution' : 'verified';
    const reasons = findings.filter(f => SEVN[f.sev] >= (code === 'threat' ? 3 : 2)).slice(0, 5).map(f => f.title);
    return { code, type, reasons, findings, links: lk.domains };
  }
  // ==SCANNER-END==

function summaryRows(res, hash, name) {
  const lvl = f => SEVN[f.sev];

  const st = w => w >= SEVN.high ? 'bad' : w >= SEVN.medium ? 'warn' : 'ok';
  const real = res.findings.filter(f => f.sev !== 'info');

  const isLk = f => f.engine === 'link-check' || f.engine === 'phishing-db';
  const lk = real.filter(f => isLk(f) && lvl(f) >= SEVN.medium);
  const hid = real.filter(f => f.engine !== 'filetype-check' && !isLk(f) && lvl(f) >= SEVN.medium);
  const sFt = st(worst(ft)), sLk = st(worst(lk)), sHid = st(worst(hid));
  const links = res.links || [];
  const rows = [
    { s: sFt, k: 'File type matches its name', v: sFt === 'ok' ? typeName(res.type, name) : 'Mismatch' },
    { s: sHid, k: 'Hidden code or commands', v: hid.length ? `${hid.length} found` : 'None found' },
    { s: sLk, k: 'Links inside the file', v: lk.length ? `${lk.length} flagged` : links.length ? `${links.length} checked` : 'None found' },
    { s: 'hash', k: 'Fingerprint', v: shortHash(hash), mono: true }

  return rows;
}

  <p>5Krypt scans AI-generated outputs (code, documents, images, PDFs) for hidden threats and proves the file you received is the exact, unchanged original that was scanned.</p>
  <p>Verdicts are risk indicators, not guarantees. 🟢 Verified means the built-in checks found nothing, not that a file is provably safe — it is not a substitute for a full antivirus scan. The service is provided “as is”.</p>`));
$('privacy-link').addEventListener('click', () => openModal('Privacy Policy', `
  <p>Your files never leave your device. No uploads, no analytics, no cookies, no third-party requests. Session history exists only in memory and is cleared when you close the tab.</p>
  <p>The share link you create contains the file’s fingerprint, name, size and scan result — never the file itself.</p>`));
$('modal-close').addEventListener('click', closeModal);
$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function sha256Hex(buf) {
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- seller: hash + full scan, then build the link that carries the verdict ---------- */
async function onPrimary(file) {
  if (file.size > MAX_BYTES) { toast(`File too large for in-browser scanning (max ${MAX_BYTES / 1048576} MB).`); return; }
  setSeal('busy', 'Scanning…', engine.on ? 'Local engine is scanning' : 'Reading the file on your device', 'busy');
  setChip(file.name, file.size); setRing(''); setRows(idleRows());
  linkLine.classList.add('hidden'); linkUrl = null; ctaLabel.textContent = 'Create verification link';
  let buf, hash;
  try { buf = await file.arrayBuffer(); hash = await sha256Hex(buf); }
  catch { setSeal('idle', 'Drop a file', 'or click to choose one', 'idle'); setChip(null); toast('Could not read that file.'); return; }
  setRing(hash);
  let res = null;
  if (engine.on) { try { res = adaptBackend(await engineScan(file)); } catch (err) { engine.lastError = String((err && err.message) || err); setEngineUI(); } }
  if (!res) {
    try { res = await scanBuffer(file.name, buf); }
    catch (err) {   // never show Verified for a file that could not be analysed
      res = { code: 'caution', type: 'unknown', reasons: ['Scan could not complete'], links: [], findings: [{ engine: 'scanner', sev: 'medium', title: 'Scan could not complete', detail: String((err && err.message) || err) }] };
    }
  }
  presentPrimary(file.name, file.size, hash, res);
}
function presentPrimary(name, size, hash, res) {
  expectedHash = hash; setRing(hash); setChip(name, size);
  const v = VERDICTS[res.code];
  const real = res.findings.filter(f => f.sev !== 'info');
  primaryResult = { code: res.code, name, size, count: real.length, reasons: res.reasons, findings: res.findings, links: res.links || [] };
  const u = new URL(BASE_URL);
  u.searchParams.set('hash', hash); u.searchParams.set('v', res.code);
  u.searchParams.set('n', name.slice(0, 80)); u.searchParams.set('s', String(size)); u.searchParams.set('f', String(real.length));
  if (res.reasons.length) u.searchParams.set('r', res.reasons.slice(0, 3).map(x => clip(x, 90)).join('|'));
  linkUrl = u.toString();
  baseRows = summaryRows(res, hash, name);
  setSeal(res.code, TITLE[res.code], SUB_SCAN[res.code], ICN[res.code]);
  setRows(baseRows);
  linkLine.textContent = linkUrl; linkLine.classList.remove('hidden');
  ctaLabel.textContent = 'Copy verification link';
  dropSec.setAttribute('aria-disabled', 'false');
  addHistory(v.short, linkUrl);
  log(`${v.label} — ${real.length} finding(s). Verification link ready.`);
}

/* ---------- buyer: hash only. Same bytes = same scan result, so no second scan is needed ---------- */
async function onSecondary(file, extra) {
  if (!expectedHash) { toast('Scan a file first, or open a verification link.'); return; }
  if (file.size > MAX_BYTES) { toast('File too large to hash in the browser.'); return; }
  let hash;
  try { hash = await sha256Hex(await file.arrayBuffer()); } catch { toast('Could not read that file.'); return; }
  setChip(file.name, file.size);
  const here = window.location.href;
  const xr = extra ? [{ s: 'idle', k: `Found: ${clip(extra.path, 60)}`, small: true }, { s: 'idle', k: 'Scan time', v: `${extra.ms} ms`, small: true }, { s: 'idle', k: extra.stats, small: true }] : [];
  if (hash === expectedHash) {
    const pr = primaryResult;
    if (pr) {
      setSeal(pr.code, TITLE[pr.code], SUB_MATCH[pr.code], ICN[pr.code]);
      setRows([{ s: 'ok', k: 'Your file', v: 'Identical to original' }].concat(baseRows || linkRows(pr, expectedHash), xr));
      addHistory(VERDICTS[pr.code].short, here);
      log(`Match — ${VERDICTS[pr.code].label}`);
    } else {
      setSeal('verified', 'Authentic', 'Identical to the original — this link has no scan result', 'ok');
      setRows([{ s: 'ok', k: 'Your file', v: 'Identical to original' }, { s: 'hash', k: 'Fingerprint', v: shortHash(hash), mono: true }]);
      addHistory('Matched', here);
    }
  } else {
    setSeal('tampered', 'Tampered', extra && extra.modified ? 'Same name or size, but the contents were modified' : 'Not the file that was scanned', 'bad');
    setRows([
      { s: 'bad', k: 'Your file', v: 'Different from original' },
      { s: 'hash', k: 'Expected', v: shortHash(expectedHash), mono: true },
      { s: 'hash', k: 'Yours', v: shortHash(hash), mono: true }
    ].concat(xr));
    addHistory('Tampered', here);
    log('Mismatch — this is not the scanned file.');
  }
}


/* ---------- local engine (backend.py / server.py on 127.0.0.1) ---------- */
const engine = { on: false, base: '', token: '', health: null, lastError: '' };
const metaTok = document.querySelector('meta[name="5krypt-token"]');
function storeGet(k) { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } }
function storeSet(k, v) { try { sessionStorage.setItem(k, v); } catch { /* private mode */ } }
async function engineCall(path, opts = {}) {
  const r = await fetch(engine.base + path, { ...opts, headers: { 'X-5K-Token': engine.token, ...(opts.headers || {}) } });
  let j = null; try { j = await r.json(); } catch { /* non-JSON */ }
  if (!r.ok) throw new Error((j && j.error) || `Engine returned HTTP ${r.status}`);
  return j;
}
async function engineConnect(base, token) {
  engine.base = base.replace(/\/+$/, ''); engine.token = token; engine.on = false; engine.lastError = '';
  try { engine.health = await engineCall('/api/health'); engine.on = true; storeSet('5k-base', engine.base); storeSet('5k-token', token); }
  catch (e) { engine.lastError = String((e && e.message) || e); }
  setEngineUI();
  return engine.on;
}
function engineScan(file) {
  return engineCall('/api/scan', { method: 'POST', headers: { 'X-File-Name': encodeURIComponent(file.name), 'Content-Type': 'application/octet-stream' }, body: file });
}
function adaptBackend(r) {
  return { code: r.verdict.code, type: r.file.detected_type, reasons: r.verdict.reasons || [], links: [], attribution: r.attribution_matrix, engines: r.engines, raw: r,
    findings: r.findings.map(f => ({ engine: f.engine, sev: f.severity, title: f.title, detail: f.detail, evidence: f.evidence })) };
}
function setEngineUI() {
  const pill = $('eng-status');
  pill.dataset.on = engine.on ? '1' : '';
  const miss = engine.on && engine.health ? Object.entries(engine.health.engines).filter(([k, v]) => v === false).map(([k]) => k) : [];
  pill.textContent = engine.on ? (miss.length ? `Local engine · ${miss.length} tool${miss.length > 1 ? 's' : ''} missing` : 'Local engine connected') : 'Browser-only checks · connect engine';
  pill.title = engine.on ? (miss.length ? 'Missing: ' + miss.join(', ') : 'All scanners available') : (engine.lastError || 'Start server.py on this computer, then click to connect');
  $('pill-text').textContent = engine.on ? 'Local engine' : 'Runs in your browser';
}
function connectModal() {
  const f = document.createElement('form'); f.className = 'cform';
  const mk = (label, val, ph) => { const l = document.createElement('label'); l.textContent = label; const i = document.createElement('input'); i.value = val; i.placeholder = ph; i.autocomplete = 'off'; i.spellcheck = false; l.appendChild(i); f.appendChild(l); return i; };
  const u = mk('Engine address', engine.base || storeGet('5k-base') || 'http://127.0.0.1:8765', 'http://127.0.0.1:8765');
  const t = mk('Token (printed by server.py)', engine.token || storeGet('5k-token'), 'paste token');
  const msg = document.createElement('p'); msg.className = 'cmsg'; msg.textContent = engine.lastError || 'Start it with: python3 server.py --origin ' + location.origin;
  const b = document.createElement('button'); b.type = 'submit'; b.className = 'cta'; b.textContent = 'Connect';
  f.append(msg, b);
  f.addEventListener('submit', async e => { e.preventDefault(); b.disabled = true; msg.textContent = 'Connecting…'; const ok = await engineConnect(u.value.trim(), t.value.trim()); b.disabled = false; if (ok) { closeModal(); toast('Local engine connected'); } else msg.textContent = engine.lastError || 'Could not connect'; });
  openModal('Local scan engine', f);
}
$('eng-status').addEventListener('click', () => { if (!engine.on) connectModal(); else openModal('Local scan engine', engineInfoNode()); });
function engineInfoNode() {
  const d = document.createElement('div');
  const pre = document.createElement('pre'); pre.className = 'eng-json';
  pre.textContent = Object.entries(engine.health.engines).map(([k, v]) => `${typeof v === 'boolean' ? (v ? '✓' : '✗') : '·'} ${k}${typeof v === 'boolean' ? '' : ': ' + JSON.stringify(v)}`).join('\n');
  d.appendChild(pre); return d;
}
(async () => {
  if (metaTok && metaTok.content) await engineConnect(location.origin, metaTok.content);
  else if (storeGet('5k-token')) await engineConnect(storeGet('5k-base') || 'http://127.0.0.1:8765', storeGet('5k-token'));
  else setEngineUI();
})();

/* ---------- folder access: one permission grant, recursive walk ---------- */
const HAS_PICKER = typeof window.showDirectoryPicker === 'function';
let grantedDir = null;       // last chosen folder (only used as the picker's start location)
async function pickDir() {
  // Always ask: every click on the drop box lets the user choose a (different) folder.
  const opts = { id: '5krypt', mode: 'read' };
  if (grantedDir) opts.startIn = grantedDir;      // open near the last folder for convenience
  let h;
  try { h = await window.showDirectoryPicker(opts); }
  catch (e) { if (e && e.name === 'TypeError') h = await window.showDirectoryPicker({ mode: 'read' }); else throw e; }
  grantedDir = h;
  return h;
}
async function* walkDir(dir, prefix = '', depth = 0) {
  if (depth > 64) { yield { path: prefix, error: 'Folder nesting too deep — skipped' }; return; }
  let it;
  try { it = dir.values(); } catch (e) { yield { path: prefix, error: String(e && e.message || e) }; return; }
  try {
    for await (const h of it) {
      if (h.kind === 'file') yield { path: prefix + h.name, handle: h };
      else if (h.kind === 'directory') yield* walkDir(h, prefix + h.name + '/', depth + 1);
    }
  } catch (e) { yield { path: prefix, error: 'Could not list folder: ' + String(e && e.message || e) }; }
}
const RANK = { threat: 0, caution: 1, verified: 2 };
async function scanFolder(dir) {
  const box = document.createElement('div');
  const head = document.createElement('div'); head.className = 'fold-head';
  const list = document.createElement('div'); list.className = 'fold-list';
  const exp = document.createElement('button'); exp.type = 'button'; exp.className = 'cta'; exp.textContent = 'Export JSON report'; exp.disabled = true;
  box.append(head, list, exp);
  openModal(`Scanning “${dir.name}”`, box);
  const results = [], counts = { verified: 0, caution: 0, threat: 0 }; let seen = 0, done = 0, walking = true;
  const upd = () => { head.textContent = `${done}/${seen}${walking ? '+' : ''} files · 🟢 ${counts.verified} · 🟡 ${counts.caution} · 🔴 ${counts.threat}` + (engine.on ? '' : ' · browser-only checks'); };
  const addRow = r => {
    const row = document.createElement('div'); row.className = `frow ${r.code}`;
    const e = document.createElement('span'); e.className = 'fe'; e.textContent = r.code === 'verified' ? '🟢' : r.code === 'caution' ? '🟡' : '🔴';
    const n = document.createElement('span'); n.className = 'fn'; n.textContent = r.path; n.title = r.path + (r.reasons[0] ? ' — ' + r.reasons[0] : '');
    const why = document.createElement('small'); why.textContent = r.reasons[0] ? clip(r.reasons[0], 80) : (r.hash ? shortHash(r.hash) : '');
    const lk = document.createElement('button'); lk.type = 'button'; lk.className = 'open'; lk.textContent = 'Link';
    lk.onclick = () => { if (!r.hash) return; closeModal(); presentPrimary(r.name, r.size, r.hash, r.res); };
    if (!r.hash) lk.disabled = true;
    const wrap = document.createElement('span'); wrap.className = 'fw'; wrap.append(n, why);
    row.append(e, wrap, lk); list.appendChild(row);
  };
  const queue = [];
  const waiters = [];
  const push = x => { queue.push(x); const w = waiters.splice(0); w.forEach(f => f()); };
  (async () => { for await (const ent of walkDir(dir)) { seen++; push(ent); upd(); } walking = false; push(null); upd(); })();
  const worker = async () => {
    for (;;) {
      while (!queue.length) await new Promise(r => waiters.push(r));
      const ent = queue.shift();
      if (ent === null) { push(null); return; }   // re-broadcast sentinel so every worker exits
      let out;
      try {
        if (ent.error) throw new Error(ent.error);
        const file = await ent.handle.getFile();
        if (file.size > MAX_BYTES && !engine.on) throw new Error('File too large for browser-only scan');
        let res = null, hash = null;
        if (engine.on) { const rr = await engineScan(file); res = adaptBackend(rr); hash = rr.file.sha256; }
        else if (file.size <= MAX_BYTES) { const buf = await file.arrayBuffer(); hash = await sha256Hex(buf); res = await scanBuffer(file.name, buf); }
        out = { path: ent.path, name: file.name, size: file.size, hash, code: res.code, reasons: res.reasons, res, report: res.raw || { verdict: { code: res.code, reasons: res.reasons }, file: { name: file.name, size: file.size, sha256: hash }, findings: res.findings, engine: 'browser-only' } };
      } catch (err) {   // unreadable / corrupt / engine error => never green
        const m = String((err && err.message) || err);
        out = { path: ent.path, name: ent.path.split('/').pop(), size: 0, hash: null, code: 'caution', reasons: ['Could not be scanned: ' + m], res: null, report: { path: ent.path, error: m, verdict: { code: 'caution' } } };
      }
      counts[out.code]++; done++; results.push(out); upd();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  results.sort((a, b) => RANK[a.code] - RANK[b.code] || a.path.localeCompare(b.path));
  list.textContent = ''; results.forEach(addRow);
  $('modal-title').textContent = `Folder “${dir.name}” — ${results.length} file${results.length === 1 ? '' : 's'}`;
  exp.disabled = false;
  exp.onclick = () => {
    const blob = new Blob([JSON.stringify({ folder: dir.name, scanned_at: new Date().toISOString(), engine_connected: engine.on, counts, files: results.map(r => ({ path: r.path, ...r.report })) }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `5krypt-${dir.name}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  upd(); log(`Folder scan done: ${counts.threat} threat, ${counts.caution} caution, ${counts.verified} verified`);
}
async function scanFolderClick() {
  if (mode !== 'seller') { window.location.href = BASE_URL; return; }
  try {
    if (HAS_PICKER) { await scanFolder(await pickDir()); }
    else inFolder.click();
  } catch (e) { if (!e || e.name !== 'AbortError') toast('Could not open that folder: ' + ((e && e.message) || e)); }
}
const inFolder = $('file-folder');
inFolder.addEventListener('change', async () => {      // fallback for browsers without showDirectoryPicker
  const files = Array.from(inFolder.files || []); inFolder.value = '';
  if (!files.length) return;
  const name = (files[0].webkitRelativePath || '').split('/')[0] || 'folder';
  await scanFolder({ name, values: async function* () { for (const f of files) yield { kind: 'file', name: f.webkitRelativePath.split('/').slice(1).join('/') || f.name, getFile: async () => f }; } });
});


/* ---------- wiring ---------- */
function wireDrop(zone, input, handler, enabled) {
  zone.addEventListener('click', () => { if (enabled()) input.click(); else if (zone === dropSec) toast('Scan a file first, or open a verification link.'); });
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zone.click(); } });
  zone.addEventListener('dragover', e => { e.preventDefault(); if (enabled()) zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    if (enabled()) handler(f); else if (zone === dropSec) toast('Scan a file first, or open a verification link.');
  });
  input.addEventListener('change', () => { if (input.files[0]) handler(input.files[0]); input.value = ''; });
}
wireDrop(seal, inPrimary, onPrimary, () => mode === 'seller');
wireDrop(dropSec, inSecondary, onSecondary, () => !!expectedHash);

async function copyLink() {
  try { await navigator.clipboard.writeText(linkUrl); }
  catch { const t = document.createElement('textarea'); t.value = linkUrl; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch { /* ignore */ } t.remove(); }
  toast('Verification link copied');
}
cta.addEventListener('click', () => {
  if (mode === 'buyer') { window.location.href = BASE_URL; return; }
  if (!linkUrl) { inPrimary.click(); return; }
  copyLink();
});
linkLine.addEventListener('click', () => { if (linkUrl) copyLink(); });

/* ---------- init: opening a shared link = buyer mode ---------- */
setRows(idleRows());
const params = new URLSearchParams(window.location.search);
const ph = params.get('hash') || '';
if (/^[0-9a-fA-F]{64}$/.test(ph)) {
  mode = 'buyer'; app.dataset.mode = 'buyer';
  expectedHash = ph.toLowerCase();
  seal.classList.remove('clickable'); seal.removeAttribute('role'); seal.setAttribute('tabindex', '-1'); seal.removeAttribute('aria-label');
  setRing(expectedHash);
  dropTitle.textContent = 'Drop the file you received';
  dropSubEl.textContent = 'Compared with the scanned original · locally';
  dropSec.setAttribute('aria-disabled', 'false');
  ctaLabel.textContent = 'Scan my own file instead';
  const vc = params.get('v');
  if (VERDICTS[vc]) {
    const reasons = (params.get('r') || '').split('|').filter(Boolean).slice(0, 3).map(x => clip(x, 120));
    const sz = parseInt(params.get('s') || '', 10);
    const name = (params.get('n') || '').slice(0, 80);
    primaryResult = { code: vc, name, size: Number.isFinite(sz) ? sz : null, count: parseInt(params.get('f') || '0', 10) || 0, reasons, links: [], findings: [] };
    baseRows = linkRows(primaryResult, expectedHash);
    setSeal(vc, TITLE[vc], SUB_ORIG[vc], ICN[vc]);
    setRows(baseRows);
    setChip(name || null, primaryResult.size);
    log(`Scan result in link: ${VERDICTS[vc].label}`);
  } else {
    setSeal('idle', 'Link loaded', 'Drop the AI output you received to check it', 'idle');
    setRows([{ s: 'hash', k: 'Fingerprint', v: shortHash(expectedHash), mono: true }]);
    log('This link has no scan result — hash check only.');
  }
} else {
  setSeal('idle', 'Drop a file', 'or click to choose one', 'idle');
}

</script>
